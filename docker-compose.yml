services:
  mysql:
    image: mysql:8.0
    container_name: gitprotect_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_staging_master_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gitprotect}
      MYSQL_USER: ${MYSQL_USER:-gitprotect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gitprotect_staging_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_staging_master_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gitprotect_net

  redis:
    image: redis:7-alpine
    container_name: gitprotect_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - gitprotect_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitprotect_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GITPROTECT_AES_MASTER_KEY: ${GITPROTECT_AES_MASTER_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gitprotect}
      MYSQL_DB: ${MYSQL_DATABASE:-gitprotect}
      MYSQL_USER: ${MYSQL_USER:-gitprotect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gitprotect_staging_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_WEBHOOK_CALLBACK_URL: ${GITHUB_WEBHOOK_CALLBACK_URL:-https://localhost/api/v1/webhooks/github}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-organization.vn,gitprotect.io}
    expose:
      - "8000"
    networks:
      - gitprotect_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitprotect_worker
    restart: unless-stopped
    command: ["python", "-m", "app.modules.engine.worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      GITPROTECT_AES_MASTER_KEY: ${GITPROTECT_AES_MASTER_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gitprotect}
      MYSQL_DB: ${MYSQL_DATABASE:-gitprotect}
      MYSQL_USER: ${MYSQL_USER:-gitprotect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gitprotect_staging_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_WEBHOOK_CALLBACK_URL: ${GITHUB_WEBHOOK_CALLBACK_URL:-https://localhost/api/v1/webhooks/github}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-organization.vn,gitprotect.io}
    networks:
      - gitprotect_net

  frontend:
    build:
      context: ./gitprotect_frontend
      dockerfile: Dockerfile
    container_name: gitprotect_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    networks:
      - gitprotect_net

  nginx:
    image: nginx:alpine
    container_name: gitprotect_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gitprotect_net

volumes:
  mysql_staging_data:
  redis_staging_data:

networks:
  gitprotect_net:
    driver: bridge
