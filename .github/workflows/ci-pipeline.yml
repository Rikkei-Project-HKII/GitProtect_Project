name: GitProtect CI - Lint, Test & SAST Security Scan

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  backend-ci:
    name: Backend Pytest & Bandit SAST
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GITPROTECT_AES_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio bandit

      - name: Run SAST Security Scan (Bandit)
        run: bandit -r app -ll -ii

      - name: Run Unit & Integration Tests (Pytest)
        run: |
          if [ -d tests ]; then pytest; else echo "No tests directory yet"; fi

  frontend-ci:
    name: Frontend ESLint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gitprotect_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Frontend Build Check
        run: npm run build
