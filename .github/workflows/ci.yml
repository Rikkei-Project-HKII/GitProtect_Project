name: GitProtect CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pytest-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f gitprotect_backend/requirements.txt ]; then pip install -r gitprotect_backend/requirements.txt; fi
          pip install pytest

      - name: Run Pytest
        run: |
          cd gitprotect_backend
          pytest tests/ --doctest-modules --junitxml=junit/test-results.xml

  eslint-frontend:
    name: Frontend ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: gitprotect_frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd gitprotect_frontend
          npm ci

      - name: Run ESLint
        run: |
          cd gitprotect_frontend
          npm run lint

  sast-bandit:
    name: Python SAST Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -r gitprotect_backend/ -ll -ii -x gitprotect_backend/tests/